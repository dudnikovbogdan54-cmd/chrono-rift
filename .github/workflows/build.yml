name: Build Chrono Rift

on:
  push:
    paths:
      - "source/chrono-rift-2.1.0-source.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Extract project
        run: |
          mkdir -p work
          unzip source/chrono-rift-2.1.0-source.zip -d work
      - name: Build mod
        working-directory: work
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: chrono-rift-2.1.0
          path: work/build/libs/*.jar
          if-no-files-found: error
